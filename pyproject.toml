[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwise"
version = "0.1.0"
description = "AI-based uncertainty-aware air quality assessment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cdsapi>=0.7.7",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "PyYAML>=6.0.3",
    "reportlab>=5.0.1",
    "netcdf4>=1.7.4",
    "shapely>=2.1.2",
    "pyproj>=3.7.1",
    "scipy>=1.15.3",
    "xarray==2025.6.1",
]

[project.scripts]
airwise-daily = "airwise.cli.daily:main"
airwise-acquire-daily-inputs = "airwise.cli.acquire:main"
airwise-compute-aqi = "airwise.cli.aqi:main"
airwise-compute-confidence = "airwise.cli.confidence:main"
airwise-report = "airwise.cli.report:main"
airwise-report-json = "airwise.cli.report:main"
airwise-report-pdf = "airwise.cli.report:pdf_main"
airwise-report-tbi = "airwise.cli.report:transboundary_main"
airwise-download-open-ifs = "airwise.cli.download:openifs_main"
airwise-download-cams-forecast = "airwise.cli.download:cams_forecast_main"
airwise-download-cams-archive = "airwise.cli.download:cams_archive_main"
airwise-download-policy-forecast = "airwise.cli.download:policy_main"
airwise-download-era5 = "airwise.cli.download:era5_main"
airwise-regrid-era5 = "airwise.cli.training_data:regrid_main"
airwise-build-training-zarr = "airwise.cli.training_data:prepare_main"
airwise-train-model = "airwise.cli.training_data:train_main"

[project.optional-dependencies]
# Daily acquisition, pretrained-model inference, and JSON/PDF reporting.
# PyTorch is unpinned so pip can select a wheel for the current platform.
report = [
    "torch",
    "cfgrib>=0.9.15.1",
    "ecmwf-opendata>=0.3.34",
]
# Model retraining only. Install together with `report` when both workflows
# are needed; CUDA is optional and is not declared as a project dependency.
train = [
    "torch",
    "tensorboard>=2.21.0",
    "dask>=2026.8.0",
    "zarr>=2.18.3",
]
inference = [
    "torch",
]
regrid = [
    "dask>=2026.8.0",
]
open-ifs = [
    "cfgrib>=0.9.15.1",
    "ecmwf-opendata>=0.3.34",
]
zarr = [
    "dask>=2026.8.0",
    "zarr>=2.18.3",
]
test = [
    "pytest>=9.1.1",
    "jsonschema>=4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airwise = ["resources/**/*.yaml", "resources/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
